<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">Study notes collage</title><desc id="desc">Abstract editorial illustration of a study sheet, note cards and orbiting shapes.</desc>
<circle cx="365" cy="255" r="190" fill="#e8e9e1"/><circle cx="365" cy="255" r="165" fill="none" stroke="#b9c9b7" stroke-opacity=".45"/>
<ellipse cx="360" cy="260" rx="285" ry="142" fill="none" stroke="#a9c5cf" stroke-opacity=".55" transform="rotate(-22 360 260)"/>
<g transform="rotate(-9 250 260)"><rect x="120" y="115" width="245" height="300" rx="5" fill="#fffefa" stroke="#dedfd7"/><text x="145" y="155" font-family="Arial" font-size="10" letter-spacing="2" fill="#7b8278">FIELD NOTE / 01</text><path d="M145 190h145M145 207h108M145 224h160" stroke="#e5e6df" stroke-width="6" stroke-linecap="round"/><circle cx="305" cy="360" r="27" fill="none" stroke="#9eb59c"/><text x="305" y="364" text-anchor="middle" font-family="Georgia" font-size="14" fill="#69856d">RJU</text></g>
<g transform="rotate(4 420 265)"><rect x="265" y="75" width="280" height="345" rx="5" fill="#fffefa" stroke="#dedfd7" filter="url(#shadow)"/><text x="292" y="110" font-family="Arial" font-size="9" letter-spacing="2" fill="#7c8177">YOUR BCA, AT A GLANCE</text><text x="290" y="205" font-family="Georgia" font-size="76" fill="#171916">8</text><text x="350" y="202" font-family="Arial" font-size="14" fill="#777a72">semesters</text><path d="M292 230h225" stroke="#dedfd7"/><circle cx="301" cy="265" r="5" fill="#83c8e6"/><text x="316" y="269" font-family="Arial" font-size="11" fill="#55584f">Learn the foundations</text><circle cx="301" cy="304" r="5" fill="#789b78"/><text x="316" y="308" font-family="Arial" font-size="11" fill="#55584f">Build your toolkit</text><circle cx="301" cy="343" r="5" fill="#e5a477"/><text x="316" y="347" font-family="Arial" font-size="11" fill="#55584f">Bring it together</text><path d="M292 372h225" stroke="#e7e7df"/><text x="292" y="394" font-family="Arial" font-size="8" letter-spacing="2" fill="#999b92">A FOUR-YEAR JOURNEY</text></g>
<g><rect x="35" y="85" width="150" height="74" fill="#fffefa" stroke="#e5e4dc" transform="rotate(-7 35 85)"/><circle cx="58" cy="112" r="12" fill="#e8f4f8"/><text x="58" y="116" text-anchor="middle" font-family="Arial" font-size="12" fill="#3b8ba9">⌘</text><text x="78" y="111" font-family="Arial" font-size="11" font-weight="bold" fill="#252922">Think clearly.</text><text x="78" y="129" font-family="Arial" font-size="9" fill="#898d83">Start with basics.</text></g>
<g><rect x="530" y="365" width="155" height="75" fill="#fffefa" stroke="#e5e4dc" transform="rotate(6 530 365)"/><circle cx="555" cy="392" r="12" fill="#edf2e9"/><text x="555" y="396" text-anchor="middle" font-family="Arial" font-size="13" fill="#668765">↗</text><text x="576" y="391" font-family="Arial" font-size="11" font-weight="bold" fill="#252922">Keep building.</text><text x="576" y="409" font-family="Arial" font-size="9" fill="#898d83">One step at a time.</text></g>
<text x="585" y="105" font-family="Georgia" font-size="25" fill="#789b78">✳</text><text x="90" y="445" font-family="Georgia" font-size="20" fill="#789b78">✦</text>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#31372d" flood-opacity=".09"/></filter></defs>
</svg>